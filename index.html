<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxury Brand Mash</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <h1>Luxury Brand Mash</h1>
    <p>Compara marcas de vehículos de lujo en duelos A/B. El ranking final refleja únicamente tus decisiones.</p>
  </header>

  <div class="container">
    <h2>¿Cuál prefieres?</h2>

    <div class="comparison">
      <div id="brandA" class="brand"></div>
      <div id="brandB" class="brand"></div>
    </div>

    <button onclick="showRanking()">Ver ranking</button>

    <div id="ranking">
      <h2>Ranking actual</h2>
      <ol id="rankingList"></ol>
    </div>
  </div>

  <footer>
    Algoritmo de recomendación basado en comparación A/B y ranking acumulado.
  </footer>

  <script src="script.js"></script>
</body>
</html>
